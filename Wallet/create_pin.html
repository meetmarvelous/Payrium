<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Payrium - Create PIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0d59f2",
                        "background-light": "#f5f6f8",
                        "background-dark": "#101622",
                        "surface-dark": "#1a2233",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        /* Dynamic viewport height for mobile browsers */
        @supports (height: 100dvh) {
            .h-screen-safe {
                height: 100dvh !important;
            }
        }

        /* Safe area insets for notched devices */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        /* PIN dot animations */
        .pin-dot {
            transition: all 0.15s ease-out;
        }
        .pin-dot.filled {
            background-color: #0d59f2;
            transform: scale(1.1);
        }
        .pin-dot.error {
            background-color: #ef4444;
            animation: shake 0.4s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        /* Keypad button press effect */
        .keypad-btn:active {
            transform: scale(0.95);
            background-color: rgba(13, 89, 242, 0.1);
        }
    </style>
</head>

<body
    class="flex min-h-screen w-full flex-col bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white overflow-x-hidden h-screen-safe">
    
    <!-- Header -->
    <header
        class="flex-none flex items-center justify-between whitespace-nowrap border-b border-solid border-slate-200 dark:border-slate-800 bg-white dark:bg-surface-dark px-6 py-4 md:py-3">
        <div class="flex items-center gap-3">
            <a href="create3_verify.html" class="p-2 -ml-2 rounded-full text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                <span class="material-symbols-outlined text-[20px]">arrow_back</span>
            </a>
            <div class="h-8 w-8 rounded-lg bg-primary flex items-center justify-center text-white shadow-lg shadow-primary/20">
                <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
            </div>
            <h2 class="text-lg font-bold leading-tight tracking-tight">Payrium</h2>
        </div>
        <div class="flex items-center gap-2">
            <span class="text-xs font-medium text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 px-2.5 py-1 rounded-full">Security Setup</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col items-center justify-center p-6 md:p-4">
        <div class="w-full max-w-[400px] flex flex-col items-center">
            
            <!-- Lock Icon -->
            <div class="mb-6 md:mb-4 relative">
                <div class="size-20 md:size-16 bg-primary/10 rounded-full flex items-center justify-center">
                    <div class="size-14 md:size-12 bg-primary rounded-full flex items-center justify-center shadow-lg shadow-primary/30">
                        <span class="material-symbols-outlined text-white" style="font-size: 28px; font-variation-settings: 'FILL' 1;">lock</span>
                    </div>
                </div>
            </div>

            <!-- Title & Description -->
            <div class="text-center mb-8 md:mb-5">
                <h1 class="text-2xl font-bold tracking-tight mb-2">Create Your PIN</h1>
                <p class="text-slate-500 dark:text-slate-400 text-sm leading-relaxed">
                    Set a 6-digit PIN to secure your wallet. You'll need this to access your funds.
                </p>
            </div>

            <!-- PIN Dots Display -->
            <div class="flex gap-3 mb-8 md:mb-5" id="pinDots">
                <div class="pin-dot size-4 rounded-full bg-slate-200 dark:bg-slate-700 border-2 border-slate-300 dark:border-slate-600"></div>
                <div class="pin-dot size-4 rounded-full bg-slate-200 dark:bg-slate-700 border-2 border-slate-300 dark:border-slate-600"></div>
                <div class="pin-dot size-4 rounded-full bg-slate-200 dark:bg-slate-700 border-2 border-slate-300 dark:border-slate-600"></div>
                <div class="pin-dot size-4 rounded-full bg-slate-200 dark:bg-slate-700 border-2 border-slate-300 dark:border-slate-600"></div>
                <div class="pin-dot size-4 rounded-full bg-slate-200 dark:bg-slate-700 border-2 border-slate-300 dark:border-slate-600"></div>
                <div class="pin-dot size-4 rounded-full bg-slate-200 dark:bg-slate-700 border-2 border-slate-300 dark:border-slate-600"></div>
            </div>

            <!-- Numeric Keypad -->
            <div class="grid grid-cols-3 gap-4 md:gap-3 w-full max-w-[280px]">
                <button class="keypad-btn h-16 md:h-14 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-2xl font-semibold hover:bg-slate-50 dark:hover:bg-slate-700 transition-all shadow-sm">1</button>
                <button class="keypad-btn h-16 md:h-14 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-2xl font-semibold hover:bg-slate-50 dark:hover:bg-slate-700 transition-all shadow-sm">2</button>
                <button class="keypad-btn h-16 md:h-14 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-2xl font-semibold hover:bg-slate-50 dark:hover:bg-slate-700 transition-all shadow-sm">3</button>
                <button class="keypad-btn h-16 md:h-14 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-2xl font-semibold hover:bg-slate-50 dark:hover:bg-slate-700 transition-all shadow-sm">4</button>
                <button class="keypad-btn h-16 md:h-14 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-2xl font-semibold hover:bg-slate-50 dark:hover:bg-slate-700 transition-all shadow-sm">5</button>
                <button class="keypad-btn h-16 md:h-14 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-2xl font-semibold hover:bg-slate-50 dark:hover:bg-slate-700 transition-all shadow-sm">6</button>
                <button class="keypad-btn h-16 md:h-14 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-2xl font-semibold hover:bg-slate-50 dark:hover:bg-slate-700 transition-all shadow-sm">7</button>
                <button class="keypad-btn h-16 md:h-14 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-2xl font-semibold hover:bg-slate-50 dark:hover:bg-slate-700 transition-all shadow-sm">8</button>
                <button class="keypad-btn h-16 md:h-14 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-2xl font-semibold hover:bg-slate-50 dark:hover:bg-slate-700 transition-all shadow-sm">9</button>
                <div class="h-16 md:h-14"></div>
                <button class="keypad-btn h-16 md:h-14 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-2xl font-semibold hover:bg-slate-50 dark:hover:bg-slate-700 transition-all shadow-sm">0</button>
                <button class="keypad-btn h-16 md:h-14 rounded-2xl bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 hover:bg-slate-200 dark:hover:bg-slate-600 transition-all flex items-center justify-center">
                    <span class="material-symbols-outlined text-slate-600 dark:text-slate-300" style="font-size: 24px;">backspace</span>
                </button>
            </div>

            <!-- Continue Button (shown when PIN complete) -->
            <a href="../Dashboard/Dashboard MO.html" 
                class="w-full max-w-[280px] mt-8 md:mt-5 h-12 bg-primary hover:bg-blue-700 text-white font-semibold rounded-xl transition-colors shadow-lg shadow-primary/20 flex items-center justify-center gap-2">
                <span>Continue</span>
                <span class="material-symbols-outlined" style="font-size: 18px;">arrow_forward</span>
            </a>

            <!-- Security Note -->
            <p class="mt-6 md:mt-3 text-xs text-slate-400 dark:text-slate-500 text-center flex items-center gap-1.5">
                <span class="material-symbols-outlined" style="font-size: 14px;">info</span>
                Your PIN is stored securely on your device only.
            </p>
        </div>
    </main>

</body>

</html>
