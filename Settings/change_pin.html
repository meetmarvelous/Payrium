<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Payrium - Change PIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0d59f2",
                        "background-light": "#f5f6f8",
                        "background-dark": "#101622",
                        "surface-dark": "#1a2233",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        @supports (height: 100dvh) {
            .h-screen-safe { height: 100dvh !important; }
        }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
        .pin-dot { transition: all 0.15s ease-out; }
        .pin-dot.filled { background-color: #0d59f2; transform: scale(1.1); }
        .keypad-btn:active { transform: scale(0.95); background-color: rgba(13, 89, 242, 0.1); }
    </style>
</head>

<body class="flex min-h-screen w-full flex-col bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white overflow-x-hidden h-screen-safe">
    
    <!-- Header -->
    <header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-slate-200 dark:border-slate-800 bg-white dark:bg-surface-dark px-4 py-4">
        <div class="flex items-center gap-3">
            <a href="security_settings.html" class="p-2 -ml-2 rounded-full text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                <span class="material-symbols-outlined">arrow_back</span>
            </a>
            <h2 class="text-lg font-bold leading-tight tracking-tight">Change PIN</h2>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col items-center justify-center p-6">
        <div class="w-full max-w-[400px] flex flex-col items-center">
            
            <!-- Step Indicator -->
            <div class="flex items-center gap-2 mb-6">
                <div class="flex items-center gap-1">
                    <div class="size-2 rounded-full bg-primary"></div>
                    <div class="size-2 rounded-full bg-slate-300 dark:bg-slate-600"></div>
                    <div class="size-2 rounded-full bg-slate-300 dark:bg-slate-600"></div>
                </div>
                <span class="text-xs font-medium text-slate-500 dark:text-slate-400">Step 1 of 3</span>
            </div>

            <!-- Lock Icon -->
            <div class="mb-6">
                <div class="size-16 bg-primary/10 rounded-full flex items-center justify-center">
                    <span class="material-symbols-outlined text-primary" style="font-size: 28px; font-variation-settings: 'FILL' 1;">lock</span>
                </div>
            </div>

            <!-- Title & Description -->
            <div class="text-center mb-8">
                <h1 class="text-xl font-bold tracking-tight mb-2">Enter Current PIN</h1>
                <p class="text-slate-500 dark:text-slate-400 text-sm leading-relaxed">
                    Enter your current 6-digit PIN to continue
                </p>
            </div>

            <!-- PIN Dots Display -->
            <div class="flex gap-3 mb-8" id="pinDots">
                <div class="pin-dot size-4 rounded-full bg-slate-200 dark:bg-slate-700 border-2 border-slate-300 dark:border-slate-600"></div>
                <div class="pin-dot size-4 rounded-full bg-slate-200 dark:bg-slate-700 border-2 border-slate-300 dark:border-slate-600"></div>
                <div class="pin-dot size-4 rounded-full bg-slate-200 dark:bg-slate-700 border-2 border-slate-300 dark:border-slate-600"></div>
                <div class="pin-dot size-4 rounded-full bg-slate-200 dark:bg-slate-700 border-2 border-slate-300 dark:border-slate-600"></div>
                <div class="pin-dot size-4 rounded-full bg-slate-200 dark:bg-slate-700 border-2 border-slate-300 dark:border-slate-600"></div>
                <div class="pin-dot size-4 rounded-full bg-slate-200 dark:bg-slate-700 border-2 border-slate-300 dark:border-slate-600"></div>
            </div>

            <!-- Numeric Keypad -->
            <div class="grid grid-cols-3 gap-3 w-full max-w-[260px]">
                <button class="keypad-btn h-14 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xl font-semibold hover:bg-slate-50 dark:hover:bg-slate-700 transition-all shadow-sm">1</button>
                <button class="keypad-btn h-14 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xl font-semibold hover:bg-slate-50 dark:hover:bg-slate-700 transition-all shadow-sm">2</button>
                <button class="keypad-btn h-14 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xl font-semibold hover:bg-slate-50 dark:hover:bg-slate-700 transition-all shadow-sm">3</button>
                <button class="keypad-btn h-14 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xl font-semibold hover:bg-slate-50 dark:hover:bg-slate-700 transition-all shadow-sm">4</button>
                <button class="keypad-btn h-14 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xl font-semibold hover:bg-slate-50 dark:hover:bg-slate-700 transition-all shadow-sm">5</button>
                <button class="keypad-btn h-14 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xl font-semibold hover:bg-slate-50 dark:hover:bg-slate-700 transition-all shadow-sm">6</button>
                <button class="keypad-btn h-14 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xl font-semibold hover:bg-slate-50 dark:hover:bg-slate-700 transition-all shadow-sm">7</button>
                <button class="keypad-btn h-14 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xl font-semibold hover:bg-slate-50 dark:hover:bg-slate-700 transition-all shadow-sm">8</button>
                <button class="keypad-btn h-14 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xl font-semibold hover:bg-slate-50 dark:hover:bg-slate-700 transition-all shadow-sm">9</button>
                <div class="h-14"></div>
                <button class="keypad-btn h-14 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xl font-semibold hover:bg-slate-50 dark:hover:bg-slate-700 transition-all shadow-sm">0</button>
                <button class="keypad-btn h-14 rounded-xl bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 hover:bg-slate-200 dark:hover:bg-slate-600 transition-all flex items-center justify-center">
                    <span class="material-symbols-outlined text-slate-600 dark:text-slate-300" style="font-size: 22px;">backspace</span>
                </button>
            </div>

            <!-- Forgot PIN Link -->
            <a href="#" class="mt-6 text-sm font-medium text-primary hover:underline">
                Forgot PIN?
            </a>
        </div>
    </main>

</body>

</html>
