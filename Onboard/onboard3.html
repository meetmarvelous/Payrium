<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Onboarding: Easy Payments - Payrium</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0d59f2",
                        "background-light": "#f5f6f8",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        /* Dynamic viewport height for mobile browsers */
        @supports (height: 100dvh) {
            .h-screen-safe {
                height: 100dvh !important;
            }
        }
        /* Safe area insets for notched devices */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
    </style>
</head>
<body>
    <div class="relative flex h-screen h-screen-safe w-full flex-col bg-background-light dark:bg-background-dark overflow-hidden font-display transition-colors duration-200">
        <!-- Header / Nav -->
        <header class="flex items-center justify-between px-6 py-3 md:py-4 md:px-10 lg:px-20 pt-4 md:pt-6 shrink-0">
            <div class="flex items-center gap-2 text-gray-900 dark:text-white">
                <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-primary text-white">
                    <span class="material-symbols-outlined text-xl">account_balance_wallet</span>
                </div>
                <h2 class="text-xl font-bold tracking-tight">Payrium</h2>
            </div>
            <a href="onboard5.html" class="rounded-full px-4 py-2 text-sm font-medium text-gray-600 transition-colors hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:text-white">
                Skip
            </a>
        </header>

        <!-- Main Content Area -->
        <!-- Main Content Area -->
        <main class="layout-container flex-1 flex flex-col md:items-center md:justify-center w-full overflow-y-auto md:overflow-hidden">
            <div class="w-full h-full md:h-auto max-w-md md:max-w-6xl px-6 py-6 md:px-12 md:grid md:grid-cols-2 md:gap-16 md:items-center">
                
                <!-- Illustration Side (Left on Desktop) -->
                <div class="flex justify-center md:justify-end mb-8 md:mb-0">
                    <div class="relative flex aspect-square w-full max-w-[320px] md:max-w-[400px] items-center justify-center overflow-hidden rounded-3xl bg-white dark:bg-gray-800 shadow-xl shadow-slate-200/50 dark:shadow-none border border-slate-100 dark:border-slate-800">
                        <!-- Abstract illustration representing transfer -->
                        <div class="absolute inset-0 bg-gradient-to-br from-blue-50 to-indigo-50 dark:from-gray-800 dark:to-gray-900 opacity-50"></div>
                        <div class="relative z-10 flex flex-col items-center gap-6 p-8 scale-110 md:scale-125">
                            <!-- Floating Coin/Transfer Graphic -->
                            <div class="flex items-center gap-4">
                                <div class="h-20 w-20 rounded-2xl bg-gray-100 dark:bg-gray-700 flex items-center justify-center shadow-inner">
                                    <span class="material-symbols-outlined text-4xl text-gray-400 dark:text-gray-500">wallet</span>
                                </div>
                                <div class="flex flex-col items-center gap-1.5 animate-pulse">
                                    <div class="h-1.5 w-1.5 rounded-full bg-primary/30"></div>
                                    <div class="h-1.5 w-1.5 rounded-full bg-primary/60"></div>
                                    <div class="h-1.5 w-1.5 rounded-full bg-primary"></div>
                                    <div class="flex h-12 w-12 items-center justify-center rounded-full bg-primary text-white shadow-lg shadow-blue-500/30">
                                        <span class="material-symbols-outlined text-2xl">currency_bitcoin</span>
                                    </div>
                                    <div class="h-1.5 w-1.5 rounded-full bg-primary"></div>
                                    <div class="h-1.5 w-1.5 rounded-full bg-primary/60"></div>
                                    <div class="h-1.5 w-1.5 rounded-full bg-primary/30"></div>
                                </div>
                                <div class="h-20 w-20 rounded-2xl bg-white dark:bg-gray-600 flex items-center justify-center border border-gray-200 dark:border-gray-500 shadow-lg">
                                    <span class="material-symbols-outlined text-4xl text-primary">check_circle</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Content Side (Right on Desktop) -->
                <div class="flex flex-col items-center md:items-start text-center md:text-left">
                    <h1 class="mb-4 text-3xl md:text-5xl font-black leading-tight tracking-tight text-gray-900 dark:text-white">
                        Easy crypto payments <span class="text-primary">across chains</span>
                    </h1>
                    <p class="mb-8 text-base md:text-xl font-medium leading-relaxed text-gray-500 dark:text-gray-400 max-w-lg">
                        Send and receive assets instantly without worrying about complex networks. We handle the bridge for you.
                    </p>

                    <!-- Indicators & Action -->
                    <div class="flex w-full flex-col md:flex-row items-center md:justify-between gap-8 mt-auto md:mt-4">
                        <!-- Pagination Indicators -->
                        <div class="flex items-center gap-3">
                            <div class="h-2.5 w-10 rounded-full bg-primary transition-all shadow-sm shadow-primary/30"></div>
                            <div class="h-2.5 w-2.5 rounded-full bg-gray-200 dark:bg-gray-700"></div>
                            <div class="h-2.5 w-2.5 rounded-full bg-gray-200 dark:bg-gray-700"></div>
                        </div>

                        <!-- Next Button -->
                        <a href="onboard4.html" class="flex h-14 min-w-[160px] items-center justify-center gap-3 rounded-full bg-primary px-8 text-lg font-bold text-white shadow-xl shadow-blue-500/30 transition-all hover:bg-blue-600 hover:scale-105 active:scale-95">
                            <span>Next Step</span>
                            <span class="material-symbols-outlined font-bold">arrow_forward</span>
                        </a>
                    </div>
                </div>

            </div>
        </main>
    </div>
</body>
</html>
